<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>洛薇 Humanize</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" />
<link rel="stylesheet" href="shared/tokens.css" />
<link rel="stylesheet" href="shared/base.css" />
<link rel="stylesheet" href="shared/components.css" />
<link rel="stylesheet" href="shared/layout.css" />
<link rel="stylesheet" href="shared/motion.css" />
<style>
/* 单页壳专属：全屏 iframe 布局 */
html, body { height: 100%; margin: 0; overflow: hidden; }
.app { height: 100%; display: flex; }
.sidebar { flex-shrink: 0; }
.view-host { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.view-host iframe {
  flex: 1; width: 100%; border: none; background: #fff;
}
</style>
</head>
<body>

<div class="app">

  <!-- 全局侧边栏（由 shared/ui.js 渲染） -->
  <aside class="sidebar" id="sidebar"></aside>

  <main class="view-host">
    <!-- 子页面加载进 iframe，视图切换 = 改 src -->
    <iframe id="viewFrame" src="./dashboard.html" title="Humanize"></iframe>
  </main>

</div>

<script src="shared/icons.js"></script>
<script src="shared/ui.js"></script>
<script src="shared/api.js"></script>
<script>
/* 单页壳：侧边栏 + iframe 视图切换 */
(function () {
  var VIEWS = {
    dashboard: { name: "仪表盘", icon: "dashboard" },
    memory: { name: "长期记忆", icon: "memory" },
    jargon: { name: "黑话词库", icon: "jargon" },
    examples: { name: "回复样例", icon: "chat" },
    context: { name: "上下文追踪", icon: "file" },
    prompts: { name: "提示词模板", icon: "edit" },
    settings: { name: "设置", icon: "settings" },
  };
  var frame = document.getElementById("viewFrame");

  /* 复用共享侧边栏渲染，但导航点击改为切换 iframe */
  var host = document.getElementById("sidebar");
  if (host) {
    var nav = Object.keys(VIEWS)
      .map(function (key) {
        return (
          '<a class="nav-item" data-view="' + key + '" href="#">' +
          HZ.icon(VIEWS[key].icon) + VIEWS[key].name + "</a>"
        );
      })
      .join("");
    host.innerHTML =
      '<div class="brand">' +
      '<img class="brand-avatar" src="./assets/lovie_avatar.png" alt="洛薇" />' +
      "<div><div class=\"brand-name\">洛薇 Lovie</div>" +
      '<div class="brand-sub">Humanize v0.2.0</div></div></div>' +
      '<nav class="side-nav">' + nav + "</nav>";
  }

  function activate(key) {
    document.querySelectorAll(".nav-item").forEach(function (n) {
      n.classList.toggle("active", n.dataset.view === key);
    });
    /* iframe 内的子页面需要 asset_token 才能通过 AstrBot 页面认证；
       入口页 URL 自带 token（Dashboard 签发），提取后拼到每个视图 src */
    var token = new URLSearchParams(location.search).get("asset_token") || "";
    frame.src = "./" + key + ".html" + (token ? "?asset_token=" + encodeURIComponent(token) : "");
  }

  document.querySelectorAll(".nav-item").forEach(function (item) {
    item.addEventListener("click", function (e) {
      e.preventDefault();
      activate(item.dataset.view);
    });
  });

  activate("dashboard");
})();
</script>
</body>
</html>
