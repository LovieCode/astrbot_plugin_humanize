<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Humanize - 聊天上下文管理</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script src="lucide.js" defer></script>
  <script src="api.js" defer></script>
  <script src="memory.js" defer></script>
  <script src="examples.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-shell" id="app">
    <aside class="sidebar" aria-label="Humanize 导航">
      <div class="sidebar-signal-grid" aria-hidden="true"></div>
      <div class="brand">
        <div class="bot-mark" aria-hidden="true">
          <span class="brand-sakura"><i></i><i></i><i></i><i></i><i></i><b></b></span>
        </div>
        <span>Humanize</span>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-item" type="button" data-nav="overview" aria-label="运行总览" title="运行总览">
          <i data-lucide="house"></i><span>运行总览</span>
        </button>
        <button class="nav-item active" type="button" data-nav="jargons" aria-current="page" aria-label="黑话词库" title="黑话词库">
          <i data-lucide="book-open"></i><span>黑话词库</span><span class="nav-signal" aria-hidden="true"></span>
        </button>
        <button class="nav-item" type="button" data-nav="context" aria-label="上下文追踪" title="上下文追踪">
          <i data-lucide="scan-search"></i><span>上下文追踪</span>
        </button>
        <button class="nav-item" type="button" data-nav="memory" aria-label="长期记忆" title="内置长期记忆">
          <i data-lucide="brain"></i><span>长期记忆</span>
        </button>
        <button class="nav-item" type="button" data-nav="examples" aria-label="回复样例" title="典型短对话回复样例">
          <i data-lucide="messages-square"></i><span>回复样例</span>
        </button>
        <button class="nav-item" type="button" data-nav="protocol" aria-label="协议监控" title="协议监控">
          <i data-lucide="chart-no-axes-combined"></i><span>协议监控</span>
        </button>
        <button class="nav-item" type="button" data-nav="settings" aria-label="设置" title="设置">
          <i data-lucide="settings"></i><span>设置</span>
        </button>
      </nav>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <div class="page-heading">
          <h1>黑话词库</h1>
          <span class="signal-motif" aria-hidden="true"><i></i><i></i><b></b></span>
          <label class="scope-picker" id="scopePickerWrap">
            <span class="sr-only">当前作用域</span>
            <select id="scopePicker" aria-label="当前作用域"><option value="">全部作用域</option></select>
            <i data-lucide="chevron-down"></i>
          </label>
        </div>
        <div class="topbar-actions" id="jargonTopbarActions">
          <label class="global-search"><i data-lucide="search"></i><input id="globalSearch" type="search" placeholder="搜索词条、别名或含义" autocomplete="off"></label>
          <button class="icon-button" id="exportButton" type="button" title="导出真实词库" aria-label="导出真实词库"><i data-lucide="download"></i></button>
          <label class="learning-control" title="学习状态由插件配置控制">
            <span>学习</span><input id="learningToggle" type="checkbox" aria-label="黑话学习状态"><span class="toggle-track" aria-hidden="true"><i></i></span>
          </label>
        </div>
      </header>

      <main class="main-content" id="legacyWorkspace">
        <section class="metrics" aria-label="真实运行指标">
          <article class="metric-block"><span>词条</span><strong id="metricLearned">--</strong></article>
          <article class="metric-block metric-pending"><span>待处理</span><strong id="metricPending">--</strong></article>
          <article class="metric-block metric-success"><span>协议成功率</span><strong id="metricProtocol">--</strong></article>
          <article class="metric-block metric-blocked"><span>本周拦截</span><strong id="metricBlocked">--</strong></article>
        </section>

        <section class="content-grid">
          <div class="terms-section">
            <div class="section-toolbar">
              <div class="section-title"><h2>词条</h2><span class="signal-motif" aria-hidden="true"><i></i><i></i><b></b></span></div>
              <div class="table-filters">
                <label class="compact-search"><i data-lucide="search"></i><input id="tableSearch" type="search" placeholder="搜索词条" autocomplete="off"></label>
                <label class="select-control"><i data-lucide="list-filter"></i>
                  <select id="statusFilter" aria-label="按状态筛选">
                    <option value="">全部状态</option><option value="candidate">待确认</option><option value="confirmed">已确认</option>
                    <option value="ambiguous">有歧义</option><option value="conflict">有冲突</option><option value="disabled">已禁用</option><option value="rejected">已拒绝</option>
                  </select><i data-lucide="chevron-down"></i>
                </label>
                <label class="select-control"><select id="scopeFilter" aria-label="按作用域筛选"><option value="">全部作用域</option></select><i data-lucide="chevron-down"></i></label>
              </div>
            </div>
            <div class="table-wrap">
              <table class="jargon-table">
                <thead><tr><th>状态</th><th>词条</th><th>含义</th><th>作用域</th><th>置信度</th><th>出现</th><th>最近出现</th><th><span class="sr-only">操作</span></th></tr></thead>
                <tbody id="jargonRows"></tbody>
              </table>
              <div class="table-state" id="tableState" hidden></div>
            </div>
            <footer class="pagination-bar">
              <span id="paginationSummary">共 0 条</span><div class="pagination" id="pagination"></div>
              <label class="page-size"><select id="pageSize" aria-label="每页条数"><option value="10">10 条/页</option><option value="20">20 条/页</option><option value="50">50 条/页</option></select><i data-lucide="chevron-down"></i></label>
            </footer>
          </div>

          <aside class="detail-section jargon-detail-v2" aria-label="词条详情">
            <div id="detailEmpty" class="detail-empty"><i data-lucide="mouse-pointer-2"></i><span>选择词条查看详情</span></div>
            <div id="detailContent" hidden>
              <header class="detail-header">
                <div><h2 id="detailTerm">--</h2><span class="status-badge" id="detailStatus">--</span><span class="conflict-badge" id="detailConflict" hidden>待处理冲突</span></div>
                <span class="signal-motif" aria-hidden="true"><i></i><i></i><b></b></span>
              </header>

              <section class="detail-card entry-settings-card">
                <div class="subheading-row"><h3>匹配设置</h3><span id="detailEnabledLabel" class="small-state">--</span></div>
                <div class="entry-setting-grid">
                  <label><span>匹配模式</span><select id="matchModeSelect"><option value="smart">智能匹配</option><option value="contains">包含匹配</option><option value="exact">整条消息匹配</option></select></label>
                  <label class="inline-check"><input id="caseSensitiveToggle" type="checkbox"><span>区分大小写</span></label>
                  <label class="inline-check"><input id="entryEnabledToggle" type="checkbox"><span>允许注入</span></label>
                </div>
                <label class="stacked-field"><span>别名（每行一个）</span><textarea id="aliasesInput" rows="3" maxlength="1000" placeholder="例如：永远滴神"></textarea></label>
                <button class="secondary-button compact" id="saveEntryButton" type="button"><i data-lucide="save"></i><span>保存词条设置</span></button>
              </section>

              <section class="detail-card senses-section">
                <div class="subheading-row"><div><h3>含义</h3><small id="senseSummary">--</small></div><button class="text-button" id="toggleNewSenseButton" type="button"><i data-lucide="plus"></i><span>新增含义</span></button></div>
                <div class="new-sense-form" id="newSenseForm" hidden>
                  <textarea id="newSenseInput" rows="3" maxlength="1000" placeholder="输入新的语境含义"></textarea>
                  <div class="editor-actions"><button class="text-button" id="cancelNewSenseButton" type="button">取消</button><button class="primary-button compact" id="createSenseButton" type="button">添加</button></div>
                </div>
                <div class="sense-list" id="senseList"></div>
                <div class="merge-senses" id="mergeSenses" hidden>
                  <label><span>来源</span><select id="mergeSourceSelect"></select></label><i data-lucide="arrow-right"></i>
                  <label><span>目标</span><select id="mergeTargetSelect"></select></label>
                  <button class="secondary-button compact" id="mergeSensesButton" type="button">合并</button>
                </div>
              </section>

              <dl class="detail-facts">
                <div><dt>置信度</dt><dd><span id="detailConfidence">--</span><span class="confidence-bar"><i id="confidenceFill"></i></span></dd></div>
                <div><dt>作用域</dt><dd id="detailScope">--</dd></div><div><dt>出现次数</dt><dd id="detailOccurrences">--</dd></div>
                <div><dt>首次出现</dt><dd id="detailFirstSeen">--</dd></div><div><dt>最近出现</dt><dd id="detailLastSeen">--</dd></div>
              </dl>

              <section class="evidence-section">
                <div class="subheading-row"><h3>证据与上下文</h3><select id="evidenceSenseFilter" aria-label="按含义筛选证据"><option value="">全部含义</option></select></div>
                <ol class="evidence-list" id="evidenceList"></ol>
              </section>
              <div class="danger-zone"><button class="danger-button" id="deleteEntryButton" type="button"><i data-lucide="trash-2"></i><span>删除词条</span></button></div>
            </div>
          </aside>
        </section>

        <section class="protocol-strip">
          <div class="protocol-summary">
            <div class="section-title protocol-title"><h2>近七天协议</h2><span class="signal-motif" aria-hidden="true"><i></i><i></i><b></b></span></div>
            <div class="chart-layout"><div class="success-stat"><span>成功率</span><strong id="chartSuccessRate">--</strong><small>真实样本</small></div><div class="protocol-chart"><svg id="protocolChart" viewBox="0 0 360 100" preserveAspectRatio="none" role="img" aria-label="协议成功率趋势"></svg><div class="chart-labels" id="chartLabels"></div></div></div>
          </div>
          <div class="protocol-log-section"><table class="protocol-table"><thead><tr><th>时间</th><th>Action</th><th>状态</th><th>详情</th></tr></thead><tbody id="protocolRows"></tbody></table><div class="protocol-empty" id="protocolState" hidden></div></div>
          <aside class="rule-summary"><div class="section-title"><h2>当前设置</h2></div><dl><div><dt>状态</dt><dd><span class="rule-dot"></span><span id="ruleEnabled">--</span></dd></div><div><dt>协议注入</dt><dd id="ruleInjectionMode">--</dd></div><div><dt>配置者</dt><dd id="ruleAdministrator">--</dd></div><div><dt>普通发言</dt><dd id="ruleMessageLimit">--</dd></div><div><dt>代码/格式文本</dt><dd id="ruleMessageCount">保持完整</dd></div></dl></aside>
        </section>
      </main>

      <main class="dynamic-workspace" id="dynamicWorkspace" hidden aria-live="polite"></main>
    </div>

    <div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="true"></div>
  </div>
</body>
</html>
