<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Humanize · 人格化管理控制台</title>
  <meta name="color-scheme" content="light" />
  <meta name="referrer" content="no-referrer" />
  <!-- 国内可访问字体 CDN：霞鹜文楷，圆润可爱且适合屏幕阅读 -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app" class="app-shell" data-view-loading="true">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar" aria-label="主导航">
      <div class="sidebar-brand">
        <!-- 品牌：渐变圆角块中的简笔樱花（24×24，5 瓣描边，无填充） -->
        <span class="sidebar-brand-mark" aria-hidden="true">
          <svg class="sidebar-brand-icon" viewBox="0 0 24 24" width="22" height="22"
               fill="none" stroke="currentColor" stroke-width="1.4"
               stroke-linecap="round" stroke-linejoin="round">
            <ellipse cx="12" cy="5" rx="2.4" ry="4.5" />
            <ellipse cx="12" cy="5" rx="2.4" ry="4.5" transform="rotate(72 12 12)" />
            <ellipse cx="12" cy="5" rx="2.4" ry="4.5" transform="rotate(144 12 12)" />
            <ellipse cx="12" cy="5" rx="2.4" ry="4.5" transform="rotate(216 12 12)" />
            <ellipse cx="12" cy="5" rx="2.4" ry="4.5" transform="rotate(288 12 12)" />
            <circle cx="12" cy="12" r="1" />
          </svg>
        </span>
        <div class="sidebar-brand-text">
          <span class="sidebar-brand-title">Humanize</span>
          <span class="sidebar-brand-sub">人格化管理</span>
        </div>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav" aria-label="功能导航">
        <!-- nav items injected by app.js -->
      </nav>
      <div class="sidebar-footer">
        <span class="sidebar-footer-status">
          <span class="sidebar-footer-dot" id="sidebar-status-dot"
                data-state="ok" aria-hidden="true"></span>
          <span id="sidebar-status-text">就绪</span>
        </span>
        <span class="text-mono text-xs" id="sidebar-version">--</span>
      </div>
    </aside>

    <!-- Workspace -->
    <main class="workspace">
      <header class="topbar" id="topbar">
        <button class="topbar-menu-btn" id="topbar-menu-btn" type="button"
                aria-label="打开或收起导航菜单" aria-expanded="false">
          <i data-lucide="menu" aria-hidden="true"></i>
        </button>
        <div class="topbar-title-group">
          <span class="topbar-title" id="topbar-title">载入中…</span>
          <span class="topbar-subtitle" id="topbar-subtitle"></span>
        </div>
        <div class="topbar-actions" id="topbar-actions">
          <!-- view-level actions injected by views -->
        </div>
      </header>
      <section class="main">
        <div class="main-inner" id="view-root">
          <!-- view content injected by app.js router -->
          <div class="empty-state">
            <div class="empty-state-title">正在加载…</div>
            <div class="empty-state-message">请稍候，控制台正在初始化。</div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Drawer root is appended dynamically by ui.createDrawer -->

  <!-- Toast region (created dynamically by ui.toast, but pre-declared here) -->
  <div class="toast-region" id="toast-region" role="status" aria-live="polite"></div>

  <!-- Scripts: load order matters. All defer; executed in document order. -->
  <script defer src="./lucide.js"></script>
  <script defer src="./api.js"></script>
  <script defer src="./core.js"></script>
  <script defer src="./ui.js"></script>
  <script defer src="./views/overview.js"></script>
  <script defer src="./views/jargons.js"></script>
  <script defer src="./views/memory.js"></script>
  <script defer src="./views/examples.js"></script>
  <script defer src="./views/context.js"></script>
  <script defer src="./views/protocol.js"></script>
  <script defer src="./views/prompts.js"></script>
  <script defer src="./views/settings.js"></script>
  <script defer src="./app.js"></script>
</body>
</html>
