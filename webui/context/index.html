<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>上下文追踪 · 洛薇 Humanize</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" />
<link rel="stylesheet" href="shared/tokens.css" />
<link rel="stylesheet" href="shared/base.css" />
<link rel="stylesheet" href="shared/components.css" />
<link rel="stylesheet" href="shared/layout.css" />
<link rel="stylesheet" href="shared/motion.css" />
<link rel="stylesheet" href="shared/views/context.css" />
</head>
<body>

<div class="bg-decor">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
</div>

<div class="app">

  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">

    <div class="topbar" id="topbar"></div>

    <!-- 筛选：scope 为后端筛选参数；注入模式仅前端高亮（后端无 protocol_mode 筛选参数） -->
    <div class="cx-filter reveal">
      <div class="scope-seg">
        <span class="seg-item active" data-scope="">全部</span>
        <span class="seg-item" data-scope="group">群聊</span>
        <span class="seg-item" data-scope="private_user">私聊</span>
      </div>
      <div class="scope-seg cx-mode-seg" title="注入模式：后端无 protocol_mode 筛选参数，仅展示高亮">
        <span class="seg-item active" data-mode="both">注入模式 两者</span>
        <span class="seg-item" data-mode="temp_user">临时用户</span>
      </div>
      <span class="cx-filter-hint">注入模式无筛选参数，仅展示</span>
    </div>

    <div class="cx-layout">

      <!-- 左：运行列表 -->
      <div class="cx-list-col reveal">
        <div id="cxRunList"></div>
        <div class="pager" id="cxPager" style="display:none"></div>
      </div>

      <!-- 右：运行详情（JS 渲染，默认展示最新一条） -->
      <div class="cx-detail-col reveal">
        <div id="cxDetail"></div>
      </div>
    </div>

    <div class="footer">
      Made with
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
      by LovieCode · astrbot_plugin_humanize v0.2.0
    </div>

  </main>
</div>

<script src="shared/icons.js"></script>
<script src="shared/ui.js"></script>
<script src="shared/api.js"></script>
<script>
/* 将 data-icon 占位替换为共享图标 */
document.querySelectorAll("[data-icon]").forEach((el) => {
  const svg = HZ.icon(el.dataset.icon);
  if (el.classList.contains("cx-sec-dot") || el.classList.contains("icon-btn")) {
    el.innerHTML = svg;
  } else {
    el.insertAdjacentHTML("afterbegin", svg);
  }
});
</script>
<script src="shared/views/context.js"></script>
</body>
</html>
