<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>回复样例 · 洛薇 Humanize</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" />
<link rel="stylesheet" href="shared/tokens.css" />
<link rel="stylesheet" href="shared/base.css" />
<link rel="stylesheet" href="shared/components.css" />
<link rel="stylesheet" href="shared/layout.css" />
<link rel="stylesheet" href="shared/motion.css" />
<link rel="stylesheet" href="shared/views/examples.css" />
</head>
<body>

<div class="bg-decor">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
</div>

<div class="app">

  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">

    <div class="topbar" id="topbar"></div>

    <!-- 筛选 -->
    <div class="ex-filter reveal">
      <div class="scope-seg status-seg">
        <span class="seg-item active" data-status="">全部状态</span>
        <span class="seg-item" data-status="approved">已通过</span>
        <span class="seg-item" data-status="draft">草稿</span>
        <span class="seg-item" data-status="rejected">已拒绝</span>
        <span class="seg-item" data-status="tombstoned">已搁置</span>
      </div>
      <select class="ex-select" id="exScopeSel">
        <option value="-1">全部作用域</option>
      </select>
      <select class="ex-select" id="exAgentSel">
        <option value="-1">全部 Agent</option>
      </select>
      <div class="input-box" style="width:150px">
        <input type="text" id="exTopicInput" placeholder="话题…" />
      </div>
      <div class="input-box" style="width:150px">
        <input type="text" id="exIntentInput" placeholder="意图…" />
      </div>
    </div>

    <!-- 样例卡片流 -->
    <div class="ex-list reveal" id="exList"></div>

    <div class="pager" id="exPager"></div>

    <!-- 召回测试 -->
    <div class="ex-recall-card reveal">
      <div class="ex-recall-head">
        <span class="card-dot"></span>
        <span class="card-title">召回测试</span>
        <span style="font-size:11.5px;color:var(--text-2)">模拟一次实时召回，查看候选命中与注入 XML</span>
      </div>
      <div class="ex-recall-controls">
        <div class="input-box" style="flex:1;min-width:200px">
          <input type="text" id="recallQuery" placeholder="输入一句话，测试召回…" />
        </div>
        <select class="ex-select" id="recallScope" style="min-width:150px">
          <option value="-1">选择作用域（必填）</option>
        </select>
        <select class="ex-select" id="recallAgent" style="min-width:150px">
          <option value="-1">选择 Agent（必填）</option>
        </select>
        <button class="btn btn-tonal btn-sm" id="recallBtn">测试召回</button>
      </div>
      <div class="ex-recall-result" id="recallResult" style="display:none">
        <div class="ex-recall-bar">
          <span class="tag" id="recallIncluded"></span>
          <span style="font-size:11.5px;color:var(--text-2)" id="recallMeta"></span>
        </div>
        <div id="recallItems"></div>
        <div class="d-label" data-icon="file" style="margin-top:12px">注入内容（Examples XML）</div>
        <pre class="ex-code" id="recallContent"></pre>
      </div>
    </div>

    <div class="footer">
      Made with
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
      by LovieCode · astrbot_plugin_humanize v0.2.0
    </div>

  </main>
</div>

<!-- 样例详情抽屉 -->
<div class="drawer-mask" id="drawerMask"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <span class="drawer-title" id="drawerTitle">被夸时的害羞回应</span>
    <span class="drawer-status" id="drawerStatus">
      <span class="tag tag-approved"><span class="tag-dot"></span>已通过</span>
    </span>
    <button class="drawer-close" id="drawerClose">✕</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-foot" id="drawerFoot"></div>
</aside>

<script src="shared/icons.js"></script>
<script src="shared/ui.js"></script>
<script src="shared/api.js"></script>
<script>
/* 将 data-icon 占位替换为共享图标 */
document.querySelectorAll("[data-icon]").forEach((el) => {
  const svg = HZ.icon(el.dataset.icon);
  if (el.tagName === "BUTTON" && el.textContent.trim()) {
    el.insertAdjacentHTML("afterbegin", svg);
  } else if (el.classList.contains("m") || el.classList.contains("d-label") || el.classList.contains("ideal")) {
    el.insertAdjacentHTML("afterbegin", svg);
  } else {
    el.innerHTML = svg;
  }
});
</script>
<script src="shared/views/examples.js"></script>
</body>
</html>
